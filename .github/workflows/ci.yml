name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: npm pack --dry-run

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create GitHub Release from annotated tag notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';

          const tag = process.env.GITHUB_REF_NAME;
          const expectedTag = `v${JSON.parse(readFileSync('package.json', 'utf8')).version}`;
          if (tag !== expectedTag) {
            throw new Error(`Tag ${tag} does not match package version ${expectedTag}`);
          }

          const annotatedTag = execFileSync('git', ['cat-file', 'tag', `refs/tags/${tag}`], {
            encoding: 'utf8',
          });
          const headerEnd = annotatedTag.indexOf('\n\n');
          if (headerEnd < 0) throw new Error(`Tag ${tag} is not annotated`);
          const body = annotatedTag.slice(headerEnd + 2).trim();
          if (!body || body === `Release ${tag}`) {
            throw new Error(`Tag ${tag} has no release notes. Add Markdown notes to the annotated tag message.`);
          }

          const api = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}`;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const existing = await fetch(`${api}/releases/tags/${encodeURIComponent(tag)}`, { headers });
          if (existing.ok) {
            console.log(`Release ${tag} already exists; skipping creation.`);
            process.exit(0);
          }
          if (existing.status !== 404) {
            throw new Error(`Could not check existing release: ${existing.status} ${await existing.text()}`);
          }

          const response = await fetch(`${api}/releases`, {
            method: 'POST',
            headers: { ...headers, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              tag_name: tag,
              name: tag,
              body,
              draft: false,
              prerelease: tag.includes('-'),
              generate_release_notes: false,
            }),
          });
          if (!response.ok) {
            throw new Error(`Could not create release: ${response.status} ${await response.text()}`);
          }
          console.log(`Created GitHub Release for ${tag}.`);
          NODE
